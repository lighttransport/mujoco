name: publish-wasm

on:
  push:
    branches:
      - tinyusdz
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Release tag version to deploy'
        required: true
        default: '0.0.10'

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish physics-only MuJoCo WASM package
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.0.0-{0}.{1}', github.ref_name, github.run_number)) }}
      PUBLISH_TO_NPM: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js for npm trusted publishing
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Prepare Linux
      run: bash ./.github/workflows/build_steps.sh prepare_linux

    - name: Install NPM dependencies for WASM bindings
      run: bash ./.github/workflows/build_steps.sh npm_ci

    - name: Setup Emscripten for WASM bindings
      run: bash ./.github/workflows/build_steps.sh setup_emsdk

    - name: Build physics-only WASM bindings
      run: bash ./.github/workflows/build_steps.sh build_physics_wasm

    - name: Package and publish WASM bindings
      env:
        VERSION: ${{ env.VERSION }}
        PUBLISH_TO_NPM: ${{ env.PUBLISH_TO_NPM }}
      run: bash ./.github/workflows/build_steps.sh package_wasm
